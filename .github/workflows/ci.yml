# .github/workflows/ci.yml — L.I.O.N.E.L policy pipeline.
#
# THIS PIPELINE ENFORCES THE ARCHITECTURE. It is not a linter with opinions: every gate
# corresponds to a recorded decision, and a decision with no test is a preference.
#
# DESIGN
#   * One job per gate. Jobs are INDEPENDENT — no `needs:` between policy gates, so a
#     failure never cascades and hides the other fifteen results. You get the whole
#     picture from one run instead of peeling an onion across five pushes.
#   * Every gate runs standalone locally:  python3 ci/gates/gate_<name>.py
#     or via the runner:                   bash ci/run_gates.sh <name>
#   * Exit codes: 0 pass · 1 policy violation · 2 the gate itself is broken.
#     A broken gate is not a passing build and not a failing repository. Collapsing
#     those teaches people to ignore red, which is how a gate stops being a gate.
#
# CURRENT STATE (Phase 0, architecture 1.0.0)
#   17/17 gates green. The `artifacts` gate was red by design while one image digest was
#   unresolved; that digest is now pinned (GHCR_Digest_Justification.md) and the lockfile
#   reads 13 resolved / 0 unresolved. `l0-conformance` is no longer a stub — it enforces
#   eight invariants under a network egress guard, and ci/self_test.sh plants a violation
#   against it so it cannot silently regress.
#
# PLATFORM COVERAGE
#   Most jobs are ubuntu-latest, but the host runtime targets Windows + Git Bash
#   (ADR-0002, ADR-0014) and Turkish is a first-class locale (ADR-0023). The two jobs at
#   the bottom of this file cover both, and they run the WHOLE suite rather than one
#   gate: platform bugs live in the shell plumbing and the console encoding, not in the
#   individual checks.

name: lionel-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: "1"
  PYTHONPATH: ci/gates

jobs:

  # ── Structural ─────────────────────────────────────────────────────────────
  structure:
    name: "structure · repository layout"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_structure.py

  adr:
    name: "adr · decision records"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_adr.py

  contracts:
    name: "contracts · metadata + manifest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_contracts.py

  jsonschema:
    name: "jsonschema · schemas + examples"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema
      - run: python3 ci/gates/gate_jsonschema.py

  protobuf:
    name: "protobuf · compile + field hygiene"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml grpcio-tools
      - run: python3 ci/gates/gate_protobuf.py

  # ── Supply chain ───────────────────────────────────────────────────────────
  artifacts:
    name: "artifacts · lockfile integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # RED BY DESIGN until every artifact is pinned (ADR-0013).
      - run: python3 ci/gates/gate_artifacts.py

  docker-digests:
    name: "docker-digests · immutable pinning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_docker_digests.py

  licenses:
    name: "licenses · allowlist + review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_licenses.py

  dependencies:
    name: "dependencies · bounds + policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_dependencies.py

  # ── Hygiene ────────────────────────────────────────────────────────────────
  no-latest:
    name: "no-latest · mutable tags"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_no_latest.py

  no-pending:
    name: "no-pending · placeholders"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_no_pending.py

  no-todo:
    name: "no-todo · unregistered markers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_no_todo.py

  secrets:
    name: "secrets · credential scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # history matters: a rotated secret is still in it
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_secrets.py

  markdown:
    name: "markdown · links + structure"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_markdown.py

  shell:
    name: "shell · script policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python3 ci/gates/gate_shell.py

  # ── The one that matters most ──────────────────────────────────────────────
  architecture:
    name: "architecture · ADR conformance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # Enforces ADR-0006, 0007, 0008, 0009, 0010, 0011, 0012, 0016, 0018, 0025, 0026.
      # An architectural rule with no test is a preference. This job is the test.
      - run: python3 ci/gates/gate_architecture.py

  # ── Meta ───────────────────────────────────────────────────────────────────
  gate-self-test:
    name: "gate-self-test · gates catch violations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema grpcio-tools
      # A gate that passes a clean repo but would miss a real violation is decoration.
      # This plants known violations and asserts each is caught.
      - run: bash ci/self_test.sh

  # ── Standing gate, stubbed until Phase 6 ───────────────────────────────────
  #
  # ADR-0007. A change that improves L2/L3 while breaking L0 is a REJECTED change,
  # not a tradeoff.
  #
  # This job was previously two `echo` statements: it exited 0 and reported a green
  # checkmark for asserting nothing. There is a third state the original comment did
  # not consider — present, green, and hollow — which is worse than absent, because
  # an absent gate is visibly missing and a green stub is not.
  #
  # It now enforces eight invariants and installs a network egress guard on itself.
  l0-conformance:
    name: "l0-conformance · offline invariants (BLOCKING — ADR-0007)"
    runs-on: ubuntu-latest
    needs: [structure, contracts, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # Proves the egress guard is armed before trusting anything the gate reports.
      - name: Prove the network egress guard blocks outbound connections
        run: python3 ci/gates/gate_l0_conformance.py --prove-egress-guard
      # Eight invariants, enforced. Replaces the `echo` stubs that reported green
      # while asserting nothing — a hollow gate is worse than an absent one.
      - name: L0 offline conformance
        run: python3 ci/gates/gate_l0_conformance.py

  # ── Meta-gates: the pipeline checking itself (ADR-0030) ────────────────────
  #
  # Every gate above checks the repository. These three check the CHECKS.
  #
  # They exist because the 1.0.0 freeze audit found five defects with one shape: a rule
  # the repository states in prose and enforces nowhere. Documentation that says
  # "regenerate rather than hand-edit" with no generator. A checksum described as
  # deterministic that nothing recomputed. A rule that every gate must have rejected
  # something, with eight gates that never had. The project's own doctrine — "a decision
  # with no test is a preference" — had itself never been given a test.

  checksum:
    name: "checksum · architecture checksum reproduces"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # Runs on Linux while the freeze value was first computed on Windows. That is the
      # point, not an oversight: the checksum's whole claim is that it is a property of
      # the commit rather than of the machine, and the one time that was false, it was
      # false across exactly this boundary (*.proto unpinned → CRLF on checkout).
      - run: python3 ci/gates/gate_checksum.py

  generated-docs:
    name: "generated-docs · CI_Inventory + Policy_Gates are current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # --check never writes. CI that repairs the evidence instead of failing on it is
      # not a check.
      - run: python3 ci/gates/gate_generated_docs.py

  gate-coverage:
    name: "gate-coverage · every gate has rejected something"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      # Counts GATES, not assertions. "18/18 planted violations caught" can rise while a
      # gate that has never rejected anything sits untouched.
      - run: python3 ci/gates/gate_gate_coverage.py

  # ── Platform coverage ──────────────────────────────────────────────────────
  #
  # These two jobs run the full suite rather than a single gate. Everything above
  # tests the repository; these test the pipeline itself on the platforms the host
  # runtime actually targets. Both existed as gaps at the Phase 0 audit.

  # ADR-0002, ADR-0014 — the host runtime runs on Windows under Git Bash. A pipeline
  # that only ever runs on Ubuntu cannot tell you whether the tooling works where the
  # product lives. Phase 1 implements ProcessSupervisor with Win32 Job Objects, which
  # is untestable on Linux, so this job lands BEFORE the code it protects.
  #
  # This job already earned its place: it would have failed on the cp1252 crash in
  # ci/gates/_lib.py, where every gate died in report_and_exit AFTER passing its checks
  # and reported exit 2 on a clean repository.
  windows-policy-gates:
    name: "windows · full suite under Git Bash (ADR-0002, ADR-0014)"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # setup-python installs python.exe on Windows; every gate and both shell runners
      # invoke `python3`. Shim rather than rewrite the scripts — `python3` is the
      # correct name on the Linux jobs and in the documented local workflow.
      - name: Provide python3 on PATH
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            printf '#!/usr/bin/env sh\nexec python "$@"\n' > /usr/bin/python3
            chmod +x /usr/bin/python3
          fi
          python3 --version
      - run: pip install pyyaml jsonschema grpcio-tools
      # Deliberately NOT setting PYTHONIOENCODING. The gates must handle a console that
      # cannot encode their own output; exporting it here would hide exactly the class
      # of bug this job exists to catch.
      - name: All policy gates
        run: bash ci/run_gates.sh
      - name: Gate self-test
        run: bash ci/self_test.sh

  # ADR-0023 — Turkish locale. `İ`.lower() is `i̇` and `ı`.upper() is `I`, so under
  # tr_TR.UTF-8 case-insensitive comparison of ASCII identifiers stops being an
  # identity. Python's str.lower() is Unicode-based and locale-independent, but the
  # shell is not: `tr`, `grep -i` and `[[ = ]]` in ci/run_gates.sh and ci/self_test.sh
  # all consult LC_CTYPE. Phase 1 writes the first identifier comparisons; this job
  # makes the failure mode reachable in automation before then.
  #
  # If this job fails, the shell is wrong. Do not relax the locale.
  turkish-locale:
    name: "tr_TR.UTF-8 · locale-sensitive shell (ADR-0023)"
    runs-on: ubuntu-latest
    env:
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Turkish locale
        run: |
          set -euo pipefail
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale LANG=tr_TR.UTF-8
          locale -a | grep -i tr_TR
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema grpcio-tools
      - name: All policy gates
        run: bash ci/run_gates.sh
      - name: Gate self-test
        run: bash ci/self_test.sh
